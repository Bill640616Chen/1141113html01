<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易經問卜</title>
    <style>
        /* --- Google 字體 --- */
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@400;700&display=swap');

        /* --- 整體風格 --- */
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #fdf6e3; /* 宣紙米黃 */
            color: #583922; /* 深棕墨色 */
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M12.5 0C5.596 0 0 5.596 0 12.5v75C0 94.404 5.596 100 12.5 100h75c6.904 0 12.5-5.596 12.5-12.5v-75C100 5.596 94.404 0 87.5 0h-75zM50 25c-13.807 0-25 11.193-25 25s11.193 25 25 25 25-11.193 25-25-11.193-25-25-25z" fill-opacity=".03" fill="%23583922"/></svg>');
        }

        /* --- 容器 --- */
        .divination-container {
            width: 100%;
            max-width: 500px;
            background: rgba(253, 246, 227, 0.8);
            border: 2px solid #d3c0a5; /* 邊框顏色 */
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            text-align: center;
            backdrop-filter: blur(3px);
        }

        /* --- 標題 --- */
        h1 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 3.5em;
            color: #a52a2a; /* 硃砂紅 */
            margin: 0 0 20px 0;
            font-weight: normal;
        }

        /* --- 說明文字 --- */
        .instructions {
            font-size: 1.1em;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* --- 擲筊區域 --- */
        .casting-area {
            margin-bottom: 25px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .lines-display {
            font-family: monospace;
            font-size: 2em;
            letter-spacing: 0.2em;
            color: #333;
            margin-bottom: 15px;
        }

        /* --- 按鈕 --- */
        .action-buttons button {
            font-family: 'Noto Serif TC', serif;
            background-color: #a52a2a; /* 硃砂紅 */
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2em;
            margin: 5px;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .action-buttons button:hover {
            background-color: #8b2323;
            transform: translateY(-2px);
        }
        
        .action-buttons button:disabled {
            background-color: #c8b8a5;
            cursor: not-allowed;
            transform: none;
        }

        /* --- 卦象結果 --- */
        .result-container {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed #d3c0a5;
            display: none; /* 預設隱藏 */
            animation: fadeIn 1s ease-in-out;
        }

        .hexagram-symbol {
            font-size: 5em;
            line-height: 1;
            color: #583922;
            margin-bottom: 10px;
        }

        .hexagram-name {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 3em;
            margin: 0;
        }
        
        .hexagram-pinyin {
            font-size: 1.2em;
            color: #888;
            margin-bottom: 20px;
        }

        .interpretation {
            text-align: left;
            line-height: 1.8;
            font-size: 1.1em;
        }
        
        .interpretation h3 {
            color: #a52a2a;
            border-bottom: 1px solid #d3c0a5;
            padding-bottom: 5px;
            margin-top: 20px;
        }

        .explanation-text {
            font-size: 0.9em;
            color: #8a6d58; /* 稍淺的棕色 */
            font-style: italic;
            margin: -5px 0 10px 0;
            padding: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="divination-container">
        <h1>易經問卜</h1>
        <p class="instructions">心誠則靈，默念所問之事，而後擲筊六次以成卦。</p>

        <div class="casting-area">
            <div class="lines-display" id="lines-display"></div>
            <p id="cast-count"></p>
        </div>

        <div class="action-buttons">
            <button id="cast-button">擲筊問卜</button>
            <button id="reset-button">重置再來</button>
        </div>

        <div class="result-container" id="result-container">
            <div id="hexagram-symbol" class="hexagram-symbol"></div>
            <h2 id="hexagram-name" class="hexagram-name"></h2>
            <p id="hexagram-pinyin" class="hexagram-pinyin"></p>
            <div class="interpretation">
                <h3>【卦辭】</h3>
                <p class="explanation-text">此為對整個卦象的總體判斷，概括您所問之事的宏觀趨勢與吉凶禍福。</p>
                <p id="judgment"></p>
                <h3>【象曰】</h3>
                <p class="explanation-text">此為解釋卦的圖像象徵，並引申出面對此情勢，應有的行為與態度。</p>
                <p id="image"></p>
            </div>
        </div>
    </div>

        // --- 元素選取 ---
        const castButton = document.getElementById('cast-button');
        const resetButton = document.getElementById('reset-button');
        const linesDisplay = document.getElementById('lines-display');
        const castCountDisplay = document.getElementById('cast-count');
        const resultContainer = document.getElementById('result-container');
        
        let lines = [];
        let castCount = 0;

        // --- 事件監聽 ---
        castButton.addEventListener('click', castLine);
        resetButton.addEventListener('click', resetDivination);

        // --- 擲爻 ---
        function castLine() {
            if (castCount >= 6) return;

            castCount++;
            // 模擬三枚錢幣: 2=陰(反), 3=陽(正)
            // 6=老陰(0), 7=少陽(1), 8=少陰(0), 9=老陽(1)
            const coin1 = Math.random() < 0.5 ? 2 : 3;
            const coin2 = Math.random() < 0.5 ? 2 : 3;
            const coin3 = Math.random() < 0.5 ? 2 : 3;
            const sum = coin1 + coin2 + coin3;

            let lineValue;
            let lineSymbol;

            switch (sum) {
                case 6: lineValue = 0; lineSymbol = '⚋ x'; break; // 老陰
                case 7: lineValue = 1; lineSymbol = '⚊'; break;   // 少陽
                case 8: lineValue = 0; lineSymbol = '⚋'; break;   // 少陰
                case 9: lineValue = 1; lineSymbol = '⚊ o'; break; // 老陽
            }

            lines.unshift({ value: lineValue, symbol: lineSymbol }); // 從初爻開始，所以後來的放前面
            updateDisplay();

            if (castCount === 6) {
                castButton.disabled = true;
                setTimeout(showResult, 500); // 延遲顯示結果
            }
        }

        // --- 更新畫面顯示 ---
        function updateDisplay() {
            linesDisplay.innerHTML = lines.map(line => `<div>${line.symbol}</div>`).join('');
            castCountDisplay.textContent = `第 ${castCount} / 6 爻`;
        }

        // --- 顯示最終卦象 ---
        function showResult() {
            const binaryKey = lines.map(line => line.value).join('');
            const hexagram = I_CHING_DATA[binaryKey];

            if (hexagram) {
                document.getElementById('hexagram-symbol').textContent = hexagram.symbol;
                document.getElementById('hexagram-name').textContent = hexagram.name;
                document.getElementById('hexagram-pinyin').textContent = hexagram.pinyin;
                document.getElementById('judgment').textContent = hexagram.judgment;
                document.getElementById('image').textContent = hexagram.image;
                
                resultContainer.style.display = 'block';
            } else {
                linesDisplay.innerHTML = "卦象生成有誤，請重試。";
            }
        }

        // --- 重置 ---
        function resetDivination() {
            lines = [];
            castCount = 0;
            castButton.disabled = false;
            resultContainer.style.display = 'none';
            linesDisplay.innerHTML = '';
            castCountDisplay.textContent = '';
        }

        // --- 初始狀態 ---
        resetDivination();

    </script>

</body>
</html>
