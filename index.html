<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎄 聖誕快樂聊天室 🎄</title>
    <style>
        /* --- Google 字體 --- */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Mountains+of+Christmas:wght@700&display=swap');

        /* --- 整體風格 --- */
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0a192f; /* 深藍色，像冬夜 */
            color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* 隱藏滾動條，讓雪花效果更好 */
        }

        /* --- 聊天室容器 --- */
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 85vh;
            background: rgba(13, 36, 66, 0.85); /* 半透明深藍背景 */
            border: 2px solid #c82a36; /* 聖誕紅邊框 */
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(5px); /* 毛玻璃效果 */
            position: relative;
            z-index: 10;
        }

        /* --- 聊天室標題 --- */
        .chat-header {
            background-color: #c82a36; /* 聖誕紅 */
            color: #fff;
            padding: 15px;
            text-align: center;
            font-family: 'Mountains of Christmas', cursive;
            font-size: 2.5em;
            letter-spacing: 3px;
            border-bottom: 2px solid #b22222;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* --- 訊息顯示區域 --- */
        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        /* 訊息滾動條美化 */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: #1e3a5f;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background-color: #c82a36;
            border-radius: 4px;
        }

        /* --- 單一訊息樣式 --- */
        .message {
            background-color: #1e7e34; /* 聖誕綠 */
            padding: 10px 15px;
            border-radius: 18px;
            margin-bottom: 15px;
            max-width: 80%;
            align-self: flex-start;
            animation: fadeIn 0.5s ease-in-out;
        }

        .message .meta {
            font-size: 0.8em;
            color: #ffc107; /* 金色 */
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .message .meta .time {
            font-weight: normal;
            color: #ddd;
            margin-left: 10px;
        }

        .message .text {
            font-size: 1em;
            word-wrap: break-word;
        }

        /* --- 特殊訊息樣式 --- */
        .message.system {
            background-color: #ffc107; /* 金色 */
            color: #333;
            font-style: italic;
            align-self: center;
            text-align: center;
            max-width: 90%;
        }

        .message.highlight {
            animation: glow 1.5s infinite alternate;
            border: 1px solid #ffc107;
        }

        .message .text .big-emoji {
            font-size: 1.8em;
            vertical-align: middle;
        }
        /* --- 輸入區域 --- */
        .chat-input-form {
            display: flex;
            padding: 15px;
            background-color: rgba(10, 25, 47, 0.9);
            border-top: 2px solid #b22222;
        }

        .chat-input-form input {
            flex-grow: 1;
            border: 2px solid #28a745; /* 聖誕綠 */
            background-color: #0a192f;
            color: #fff;
            padding: 12px;
            border-radius: 20px;
            margin-right: 10px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .chat-input-form input:focus {
            border-color: #ffc107; /* 金色 */
        }

        .chat-input-form button {
            background-color: #28a745; /* 聖誕綠 */
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
        }

        .chat-input-form button:hover {
            background-color: #218838;
            transform: scale(1.05);
        }
        
        /* --- 訊息淡入動畫 --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glow {
            from { box-shadow: 0 0 5px #ffc107, 0 0 10px #ffc107; }
            to { box-shadow: 0 0 20px #ffc107, 0 0 30px #ffc107; }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .shake-animation {
            animation: shake 0.82s cubic-bezier(.36,.07,.19,.97) both;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            perspective: 1000px;
        }
        /* --- 雪花背景動畫 --- */
        .snowflake {
            color: #fff;
            font-size: 1em;
            font-family: Arial, sans-serif;
            text-shadow: 0 0 5px #000;
            position: fixed;
            top: -10%;
            z-index: 1;
            user-select: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(105vh) rotate(360deg); }
        }

        /* --- 五彩紙屑動畫 --- */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            opacity: 0.7;
            animation: fall 3s linear forwards;
            z-index: 20;
            top: -20px;
        }

        @keyframes fall {
            to {
                transform: translateY(90vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- 聊天室主體結構 -->
    <div class="chat-container">
        <header class="chat-header">
            Merry Christmas! 🎅
        </header>
        <main class="chat-messages" id="chat-messages">
            <!-- 聊天訊息會顯示在這裡 -->
        </main>
        <form class="chat-input-form" id="chat-form">
            <input type="text" id="username" placeholder="你的名字..." required>
            <input type="text" id="msg" placeholder="輸入訊息..." required autocomplete="off">
            <button type="submit">送出</button>
        </form>
    </div>

    <script>
        // --- 元素選取 ---
        const chatContainer = document.querySelector('.chat-container');
        const chatForm = document.getElementById('chat-form');
        const chatMessages = document.getElementById('chat-messages');
        const usernameInput = document.getElementById('username');
        const msgInput = document.getElementById('msg');

        // --- 監聽表單提交事件 ---
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault(); // 防止表單提交導致頁面刷新

            const username = usernameInput.value.trim();
            const msg = msgInput.value.trim();

            if (!username || !msg) {
                alert('名字和訊息不能為空喔！');
                return;
            }

            // 檢查是否為特殊指令
            if (msg.startsWith('/')) {
                handleCommand(msg);
                msgInput.value = '';
                return;
            }
            // 建立並顯示訊息
            outputMessage(username, msg);

            // 清空輸入框並保持焦點
            msgInput.value = '';
            msgInput.focus();
        });

        // --- 顯示訊息到畫面上 ---
        function outputMessage(username, text, type = 'user') {
            const div = document.createElement('div');
            div.classList.add('message');
            
            let messageText = text;

            const now = new Date();
            const timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            // 使用聖誕節相關的 emoji 增加趣味
            const icons = ['🎄', '🎁', '🌟', '🔔', '🦌'];
            const randomIcon = icons[Math.floor(Math.random() * icons.length)];

            if (type === 'user') {
                // 關鍵字效果處理
                if (text.includes('聖誕快樂') || text.toLowerCase().includes('merry christmas')) {
                    div.classList.add('highlight');
                }
                // Emoji 放大效果
                messageText = text.replace(/🎅|🎄|🎁|🌟|🔔|🦌/g, '<span class="big-emoji">$&</span>');

                div.innerHTML = `
                    <p class="meta">${randomIcon} ${username} <span class="time">${timeString}</span></p>
                    <p class="text">${messageText}</p>
                `;
            } else if (type === 'system') {
                div.classList.add('system');
                div.innerHTML = `<p class="text">${text}</p>`;
            }

            chatMessages.appendChild(div);

            // 自動滾動到最新的訊息
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // --- 處理特殊指令 ---
        function handleCommand(command) {
            const parts = command.split(' ');
            const cmd = parts[0].toLowerCase();
            const args = parts.slice(1);

            switch (cmd) {
                case '/help':
                    const helpText = `
                        可用指令: <br>
                        /help - 顯示此幫助訊息 <br>
                        /shake - 搖晃聊天室 <br>
                        /confetti - 灑下五彩紙屑 <br>
                        /changename [新名字] - 更換你的名字 <br>
                        /random - 傳送隨機聖誕祝福
                    `;
                    outputMessage('系統', helpText, 'system');
                    break;

                case '/shake':
                    chatContainer.classList.add('shake-animation');
                    setTimeout(() => {
                        chatContainer.classList.remove('shake-animation');
                    }, 820);
                    break;

                case '/confetti':
                    createConfetti();
                    outputMessage('系統', '🎉🎉🎉', 'system');
                    break;

                case '/changename':
                    if (args.length > 0) {
                        const oldName = usernameInput.value;
                        const newName = args.join(' ');
                        usernameInput.value = newName;
                        outputMessage('系統', `"${oldName}" 將名字改成了 "${newName}"`, 'system');
                    } else {
                        outputMessage('系統', '請輸入新名字: /changename [新名字]', 'system');
                    }
                    break;

                case '/random':
                    const greetings = [
                        '願你的聖誕充滿溫暖、喜悅和歡笑！',
                        '聖誕快樂，新年快樂！',
                        '叮叮噹，叮叮噹，鈴聲多響亮！',
                        '送你一棵裝滿禮物的聖誕樹！🎄',
                        '願聖誕的魔法充滿你的心房。'
                    ];
                    const randomGreeting = greetings[Math.floor(Math.random() * greetings.length)];
                    outputMessage(usernameInput.value, randomGreeting);
                    break;

                default:
                    outputMessage('系統', `未知的指令: "${cmd}"。 輸入 /help 查看可用指令。`, 'system');
                    break;
            }
        }

        // --- 五彩紙屑效果 ---
        function createConfetti() {
            const colors = ['#f00', '#0f0', '#00f', '#ff0', '#0ff', '#f0f'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                chatContainer.appendChild(confetti);

                // 動畫結束後移除元素
                setTimeout(() => confetti.remove(), 3000);
            }
        }

        // --- 雪花效果 ---
        function createSnowflakes() {
            const snowflakeCount = 100;
            const body = document.querySelector('body');

            for (let i = 0; i < snowflakeCount; i++) {
                const snowflake = document.createElement('div');
                snowflake.classList.add('snowflake');
                snowflake.textContent = '❄';
                
                // 隨機化雪花的屬性
                snowflake.style.left = Math.random() * 100 + 'vw';
                snowflake.style.animationDuration = (Math.random() * 5 + 5) + 's'; // 5-10秒
                snowflake.style.animationDelay = Math.random() * 5 + 's';
                snowflake.style.opacity = Math.random();
                snowflake.style.fontSize = (Math.random() * 10 + 10) + 'px';

                body.appendChild(snowflake);
            }
        }

        // 頁面載入時，產生雪花並顯示一則歡迎訊息
        window.onload = () => {
            createSnowflakes();
            outputMessage('聖誕老人', 'Ho Ho Ho! 歡迎來到聖誕聊天室！想跟誰聊聊呢？');
        };
    </script>

</body>
</html>
